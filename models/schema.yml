version: 2

models:
  - name: stg_customers
    description: "Cleaned customer data from raw CSV"
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null

  - name: stg_orders
    description: "Cleaned order data from raw CSV"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_date
        tests:
          - not_null
      - name: total_amount
        tests:
          - not_null

  - name: stg_order_items
    description: "Cleaned order line items from raw CSV"
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
      - name: unit_price
        tests:
          - not_null
      - name: total_price
        tests:
          - not_null

  - name: dim_customer
    description: "Customer dimension with region"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_product
    description: "Product dimension with current price"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Date dimension for slicing"
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: fact_order_items
    description: "Fact table for completed order lines"
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: order_date
        tests:
          - not_null

sources:
  - name: raw
    database: reviews
    schema: public
    tables:
      - name: raw_customers
        description: "Raw customer CSV load"
      - name: raw_orders
        description: "Raw orders CSV load"
      - name: raw_order_items
        description: "Raw order items CSV load"
