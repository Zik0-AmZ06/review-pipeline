# great_expectations.yml - GE 0.18+ v3 format
config_version: 3.0

datasources:
  review_pipeline:
    type: pandas_filesystem
    base_directory: ../data
    data_assets:
      customers:
        type: csv
        batching_regex: customers\.csv
      orders:
        type: csv
        batching_regex: orders\.csv
      order_items:
        type: csv
        batching_regex: order_items\.csv

stores:
  expectations_store:
    class_name: ExpectationsStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: expectations/
  validations_store:
    class_name: ValidationResultsStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: validations/
  evaluation_parameter_store:
    class_name: EvaluationParameterStore
  checkpoint_store:
    class_name: CheckpointStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: checkpoints/

data_docs_sites:
  local_site:
    class_name: SiteBuilder
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: data_docs/
    site_index_builder:
      class_name: DefaultSiteIndexBuilder
