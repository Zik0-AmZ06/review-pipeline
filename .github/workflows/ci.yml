name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: 5433
  POSTGRES_DB: reviews
  POSTGRES_USER: review_app
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  dbt:
    name: dbt build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reviews
          POSTGRES_USER: review_app
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U review_app -d reviews"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-postgres
        run: pip install dbt-postgres

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          review_pipeline:
            target: ci
            outputs:
              ci:
                type: postgres
                host: ${{ env.POSTGRES_HOST }}
                port: ${{ env.POSTGRES_PORT }}
                user: ${{ env.POSTGRES_USER }}
                password: ${{ env.POSTGRES_PASSWORD }}
                dbname: ${{ env.POSTGRES_DB }}
                schema: public
                threads: 4
          EOF

      - name: Load raw data
        run: |
          psql -h localhost -p 5432 -U review_app -d reviews -f sql/01_create_raw_tables.sql
          psql -h localhost -p 5432 -U review_app -d reviews -f sql/02_load_csvs.sql
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      - name: dbt build
        run: dbt build
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: dbt deps
        run: dbt deps

      - name: dbt build
        run: dbt build
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

  dashboard:
    name: Build & Deploy Dashboard
    runs-on: ubuntu-latest
    needs: dbt
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dashboard deps
        run: |
          cd dashboard
          npm ci

      - name: Build Evidence dashboard
        run: |
          cd dashboard
          npm run build

    # Deploy to Netlify (commented out until secrets configured)
    # - name: Deploy to Netlify
    #   uses: nwtgck/actions-netlify@v2.1
    #   if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
    #   with:
    #     publish-dir: ./dashboard/build
    #     production-branch: main
    #     github-token: ${{ secrets.GITHUB_TOKEN }}
    #     deploy-message: "Deploy from GitHub Actions"
    #     enable-pull-request-comment: false
    #     enable-commit-comment: true
    #     overwrites-pull-request-comment: true
    #   env:
    #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [dbt, dashboard]
    if: always()
    steps:
      - name: Status
        run: |
          echo "Pipeline completed"
          echo "dbt: ${{ needs.dbt.result }}"
          echo "dashboard: ${{ needs.dashboard.result }}"
