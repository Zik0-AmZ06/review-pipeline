name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: 5433
  POSTGRES_DB: reviews
  POSTGRES_USER: review_app
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  dbt:
    name: dbt build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reviews
          POSTGRES_USER: review_app
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U review_app -d reviews"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install dbt-postgres psycopg2-binary pandas pyyaml requests

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'DBTEOF'
          review_pipeline:
            target: ci
            outputs:
              ci:
                type: postgres
                host: ${{ env.POSTGRES_HOST }}
                port: ${{ env.POSTGRES_PORT }}
                user: ${{ env.POSTGRES_USER }}
                password: ${{ env.POSTGRES_PASSWORD }}
                dbname: ${{ env.POSTGRES_DB }}
                schema: public
                threads: 4
          DBTEOF

      - name: Initialize database schema
        run: |
          psql -h localhost -p 5433 -U review_app -d reviews -f sql/01_create_raw_tables.sql
          psql -h localhost -p 5433 -U review_app -d reviews -f sql/06_create_staging_tables.sql
          psql -h localhost -p 5433 -U review_app -d reviews -f sql/04_create_cleaned_tables.sql
          psql -h localhost -p 5433 -U review_app -d reviews -f sql/05_create_quarantine_tables.sql
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Load data via Python (portable)
        run: python ingest/load_data.py
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_DB: reviews
          POSTGRES_USER: review_app
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: dbt deps
        run: dbt deps

      - name: dbt build
        run: dbt build
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: dbt
    if: always()
    steps:
      - name: Status
        run: |
          echo "Pipeline completed"
          echo "dbt: ${{ needs.dbt.result }}"
